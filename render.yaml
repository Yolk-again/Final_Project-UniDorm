services:
  - type: web
    name: unidorm-api-demo
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start:prod
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: unidorm-demo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_REGISTRATION_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: PAYMENT_PROOF_DIR
        value: /tmp/unidorm-payment-proofs

databases:
  - name: unidorm-demo-db
    databaseName: unidorm_demo_db
    user: unidorm_demo_db_user
    region: singapore
    plan: free
    postgresMajorVersion: "18"
